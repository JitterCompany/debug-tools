hw_v0_2 = "pa15"  # pa15 | cap: TIM2_CH1
hw_v1 = "pg1"  # pg1

[test]
test_led_main_busy = "pf15"  # pf15
test_led_main_fail = "pg0"  # pg0
test_led_modem_fail = "pg11"  # pg11 | cap: TIM15_CH2
test_led_modem_ok = "pg12"  # pg12
test_led_sensor_fail = "pf14"  # pf14
test_led_sensor_ok = "pf13"  # pf13

[ui]
ui_btn_bat_qon_n = "pc7"  # pc7 | cap: TIM3_CH2/TIM8_CH2 | EXTI7 *IRQ*
ui_led_1 = "pd4"  # pd4
ui_led_2 = "pd5"  # pd5

[usb]
mcu_usb_n = "pa11"  # pa11 | cap: TIM1_CH4
mcu_usb_p = "pa12"  # pa12
mcu_usb_vbus = "pa9"  # pa9 | cap: TIM1_CH2

# power/ground:
